<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/gallery-style.css">
</head>
<body>



    <section class="gallery">
        <div class="container-lg">
            <h2></h2>
            <div class="row gy-4 row-cols-1 row-cols-sm-2 row-cols-md-3">
                <div class="col">
                    <img src="../PPC/chelakkara/IMG_20240617_184240.jpg" class="gallery-item" alt="">
                </div>
                <div class="col">
                    <img src="../PPC/chelakkara/IMG_20240617_185613.jpg" class="gallery-item" alt="">
                </div>
                <div class="col">
                    <img src="../PPC/chelakkara/IMG_20240617_191100.jpg" class="gallery-item" alt="">
                </div>
                <div class="col">
                    <img src="../PPC/chelakkara/IMG_20240617_195449.jpg" class="gallery-item" alt="">
                </div>
                <div class="col">
                    <img src="../PPC/chelakkara/IMG_20240617_195707.jpg" class="gallery-item" alt="">
                </div>
            </div>
        </div>
    </section>


  <!-- Modal -->
  <div class="modal fade" id="gallery-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
<!--           <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>-->      
           <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

            <img src="../web/PPC/chelakkara/IMG_20240617_184240.jpg" class="modal-img" alt="modal img">
          
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          
        </div>
      </div>
    </div>
  </div>

    
  

    






    <script src="../js/gallery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
